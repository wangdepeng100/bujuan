name: Multi-Platform Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_ios:
        description: '构建 iOS'           
        required: false
        type: boolean
        default: true

jobs:
  # iOS 构建
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: ${{ github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.build_ios)
        || (github.event_name == 'pull_request'
            && github.event.pull_request.merged == true
            && startsWith(github.event.pull_request.title, 'v')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Create iOS archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../cyrene_music-ios-unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: cyrene_music-ios-unsigned.ipa

  # 创建 Release
  create-release:
    name: Create Release
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: ${{ always() && (
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
          || (github.event_name == 'pull_request'
              && github.event.pull_request.merged == true
              && startsWith(github.event.pull_request.title, 'v'))
        ) }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Determine release metadata
        id: release_meta
        uses: actions/github-script@v7
        with:
          script: |
            const isPrRelease = context.eventName === 'pull_request'
              && context.payload.pull_request.merged === true
              && context.payload.pull_request.title.startsWith('v');
            if (isPrRelease) {
              const title = context.payload.pull_request.title.trim();
              const tag = title.startsWith('v') ? title : `v${title}`;
              core.setOutput('tag', tag);
              core.setOutput('target', context.payload.pull_request.merge_commit_sha);
            } else {
              const ref = context.ref;
              const tag = ref.startsWith('refs/tags/') ? ref.replace('refs/tags/', '') : ref;
              core.setOutput('tag', tag);
              core.setOutput('target', context.sha);
            }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ steps.release_meta.outputs.target }}
          files: |
            artifacts/ios-unsigned/*.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
